name: flutter_input_kit
description: >
  Semantic form fields and code-only validators for Lemsa Flutter apps.
  FieldSpec, EmailField, PasswordField, ListField — labels localized at the call site.
version: 0.0.1
publish_to: none
homepage: https://github.com/fodilfliti/flutter_input_kit
repository: https://github.com/fodilfliti/flutter_input_kit
issue_tracker: https://github.com/fodilfliti/flutter_input_kit/issues
documentation: https://github.com/fodilfliti/flutter_input_kit#readme

environment:
  sdk: ^3.7.2
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_page_kit:
    path: ../flutter_page_kit
  flutter_scale_kit:
    path: ../flutter_scale_kit
  flutter_scale_theme_kit:
    path: ../flutter_scale_theme_kit
  lemsa_core_kit:
    path: ../lemsa_core_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^9.0.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

topics:
  - flutter
  - forms
  - inputs
  - validators

flutter:
